
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컬러팡팡</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f5f1e8;color:#302b35;font-family:system-ui,sans-serif}
body>h1,body>#setup,body>#game{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
h1{text-align:center;font-size:25px;margin:8px auto 16px}
h2{font-size:17px;margin:0 0 12px}
.panel{background:#fff;border-radius:16px;padding:12px;margin:12px 0;box-shadow:0 3px 9px #0000000c}
button,select,input{font:inherit}
button{border:0;border-radius:11px;padding:10px 12px;background:#51417f;color:white;font-weight:700;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4}
.secondary{background:#e9e4f3;color:#40355e}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings label{display:block;font-size:13px}
select{width:100%;padding:8px;border:1px solid #ccc;border-radius:9px;margin-top:5px}
.name-setting{margin-bottom:14px}
.name-setting label{display:block;font-size:13px;margin-bottom:5px}
.name-setting input{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:9px}
.colors{display:flex;gap:9px;flex-wrap:wrap}
.colorChoice{width:36px;height:36px;padding:0;border:3px solid white;outline:1px solid #bbb;border-radius:9px}
.colorChoice.chosen{outline:3px solid #51417f}
.status-panel{height:120px;display:flex;flex-direction:column;overflow:hidden}
.status{font-weight:700;line-height:1.45;white-space:pre-line;min-height:44px;max-height:58px;overflow:auto}
.counter{height:18px;flex-shrink:0}
.counter,.small{font-size:12px;color:#716a78}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;flex-shrink:0}
.hidden{display:none!important}
.sticks{display:grid;grid-template-columns:repeat(10,44px);gap:4px;align-items:start}
.stick{width:44px;min-width:44px;height:62px;padding:0;position:relative;display:flex;align-items:center;justify-content:center;border-radius:7px;overflow:hidden;flex-shrink:0;box-shadow:inset 0 2px 0 #ffffff55,0 3px 3px #0002}
.stick.back{color:#fff;background:radial-gradient(circle at 25% 20%,#ffffff75 0 1px,transparent 2px),radial-gradient(circle at 75% 75%,#ffffff55 0 1.5px,transparent 2.5px),repeating-linear-gradient(135deg,#332653 0px,#332653 5px,#51417f 5px,#51417f 10px,#704d91 10px,#704d91 15px);border:1px solid #9c83bd}
.stick.front{border:1px solid #ffffff55}
.stick.selected{outline:3px solid #e0a62c;outline-offset:1px}
.stick .pattern{position:absolute;inset:6px;border:1px solid #ffffff70;border-radius:4px;pointer-events:none}
.empty-slot{width:44px;min-width:44px;height:62px;visibility:hidden;pointer-events:none}
.board-panel{overflow:hidden}
#backs{min-height:326px}
#fronts{min-height:62px}
#discarded{min-height:62px}
@keyframes flipIn{
  0%{transform:perspective(450px) rotateY(90deg) scale(.8);opacity:.15}
  55%{transform:perspective(450px) rotateY(-12deg) scale(1.06);opacity:1}
  100%{transform:perspective(450px) rotateY(0) scale(1);opacity:1}
}
@keyframes landIn{
  0%{transform:translateY(-18px) scale(.8);opacity:.2}
  70%{transform:translateY(2px) scale(1.04);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.flip-in{animation:flipIn .38s ease-out both}
.land-in{animation:landIn .28s ease-out both}
@media(max-width:480px){
  body{padding:8px}
  .panel{padding:9px}
  .sticks{grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
  .stick,.empty-slot{width:100%;min-width:0;height:54px}
  #backs{min-height:285px}
  #fronts,#discarded{min-height:54px}
  .settings{gap:8px}
  .status-panel{height:124px}
}
@media(prefers-reduced-motion:reduce){
  .flip-in,.land-in{animation:none!important}
}
</style>
</head>
<body>

<h1 id="gameTitle">🌈 컬러팡팡</h1>

<section class="panel" id="setup">
  <h2>게임 설정</h2>
  <div class="name-setting">
    <label for="playerName">플레이어 이름</label>
    <input id="playerName" type="text" maxlength="20" placeholder="이름을 입력해 줘!" autocomplete="off">
    <p class="small">이름을 입력하면 위쪽 제목이 바로 바뀌어!</p>
  </div>

  <p class="small">럭컬 색깔을 골라 줘.</p>
  <div class="colors" id="colorChoices"></div>

  <div class="settings" style="margin-top:14px">
    <label>처음 뒤집을 개수
      <select id="initialCount">
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11" selected>11</option>
      </select>
    </label>
    <label>처음 뒤집기
      <select id="initialMode">
        <option value="manual">직접 누르기</option>
        <option value="auto" selected>자동 뒤집기</option>
      </select>
    </label>
  </div>

  <div class="actionrow">
    <button id="startBtn">게임 시작!</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="panel status-panel">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="counter" id="stats"></div>
    <div class="actionrow">
      <button class="secondary" id="cancelPair">짝 선택 취소</button>
      <button class="secondary" id="soundToggle">🔊 소리 켜짐</button>
    </div>
  </div>
  <div class="panel board-panel"><div class="sticks" id="backs"></div></div>
  <div class="panel board-panel"><div class="sticks" id="fronts"></div></div>
  <div class="panel board-panel"><div class="sticks" id="discarded"></div></div>
  <div class="panel hidden" id="finished">
    <h2>🎉 게임 종료!</h2>
    <p id="finalScore" class="status"></p>
    <button id="restart">다시 하기</button>
  </div>
</section>

<script>
"use strict";

const COLORS=[
  {name:"빨강",value:"#e34e4e"},
  {name:"노랑",value:"#e2b62e"},
  {name:"초록",value:"#39a96b"},
  {name:"파랑",value:"#4389d8"},
  {name:"보라",value:"#865bd1"},
  {name:"핑크",value:"#e779ad"},
  {name:"회색",value:"#858b95"}
];

const $=id=>document.getElementById(id);

let luckyColor="빨강";
let deck=[],fronts=[],discarded=[],selectedPair=[],frontSlots=[];
/* 뒷면 막대의 화면상 자리. null은 재사용 가능한 빈자리 */
let backSlots=[];
let totalFlipped=0,pending=0,initialRemaining=0;
let phase="setup",ended=false,soundOn=true,audioCtx=null;
let lastFlippedId=null,recentMovedIds=new Set(),notice="";

function updateTitle(){
  const name=$("playerName").value.trim();
  $("gameTitle").textContent=name?`${name}의 컬러팡팡 🌈`:"🌈 컬러팡팡";
}
$("playerName").addEventListener("input",updateTitle);

function makeColorChoices(){
  $("colorChoices").innerHTML="";
  COLORS.forEach(c=>{
    const b=document.createElement("button");
    b.className="colorChoice"+(c.name===luckyColor?" chosen":"");
    b.style.background=c.value;
    b.title=c.name;
    b.setAttribute("aria-label",c.name);
    b.onclick=()=>{
      if(phase!=="setup")return;
      luckyColor=c.name;
      makeColorChoices();
    };
    $("colorChoices").appendChild(b);
  });
}

function initAudio(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return null;
    if(!audioCtx)audioCtx=new Ctx();
    return audioCtx;
  }catch(e){return null}
}

function woodenTap(ctx,time,frequency,duration,volume){
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type="triangle";
  osc.frequency.setValueAtTime(frequency,time);
  osc.frequency.exponentialRampToValueAtTime(Math.max(100,frequency*.55),time+duration);
  gain.gain.setValueAtTime(.0001,time);
  gain.gain.exponentialRampToValueAtTime(volume,time+.004);
  gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(time);osc.stop(time+duration+.015);
}

function bell(ctx,time,frequency,duration,volume){
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.setValueAtTime(frequency,time);
  gain.gain.setValueAtTime(.0001,time);
  gain.gain.exponentialRampToValueAtTime(volume,time+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(time);osc.stop(time+duration+.02);
}

async function sound(type){
  if(!soundOn)return;
  const ctx=initAudio();
  if(!ctx)return;
  try{
    if(ctx.state!=="running")await ctx.resume();
    if(ctx.state!=="running")return;
    const t=ctx.currentTime+.005;
    if(type==="flip"){
      woodenTap(ctx,t,920,.045,.16);
      woodenTap(ctx,t+.025,660,.055,.055);
    }else if(type==="move"){
      woodenTap(ctx,t,390,.075,.19);
      woodenTap(ctx,t+.018,250,.065,.07);
    }else if(type==="lucky"){
      bell(ctx,t,880,.16,.12);
      bell(ctx,t+.085,1175,.19,.11);
      bell(ctx,t+.17,1568,.25,.09);
    }else if(type==="pair"){
      woodenTap(ctx,t,520,.06,.13);
      woodenTap(ctx,t+.07,390,.07,.14);
    }else if(type==="end"){
      bell(ctx,t,784,.16,.08);
      bell(ctx,t+.12,988,.18,.08);
      bell(ctx,t+.25,1175,.25,.09);
    }
  }catch(e){console.warn("효과음을 재생하지 못했습니다.",e)}
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* 한 팩: 럭컬 10개 + 일반 색 40개 = 총 50개 */
function addPack(){
  const pack=[];

  for(let i=0;i<10;i++)pack.push(luckyColor);

  const otherColors=COLORS
    .map(c=>c.name)
    .filter(name=>name!==luckyColor);

  const counts=shuffle([8,8,6,6,6,6]);

  otherColors.forEach((color,index)=>{
    for(let i=0;i<counts[index];i++)pack.push(color);
  });

  shuffle(pack);

  pack.forEach(color=>{
    const stick={
      id:Math.random().toString(36).slice(2)+Date.now().toString(36)+Math.random(),
      color,
      state:"back",
      order:0
    };

    deck.push(stick);

    /* 기존 뒷면 자리의 빈칸을 먼저 채우고,
       빈칸이 없을 때만 새 자리를 만든다. */
    const emptyIndex=backSlots.indexOf(null);
    if(emptyIndex>=0){
      backSlots[emptyIndex]=stick.id;
    }else{
      backSlots.push(stick.id);
    }
  });
}

function getBacks(){
  return deck.filter(s=>s.state==="back");
}

/* 보너스가 남았는데 뒤집을 막대가 없으면 새 팩을 준비 */
function ensureBonusBacks(){
  if(pending>0 && getBacks().length===0){
    addPack();
  }
}

function putInFrontSlot(s){
  const emptyIndex=frontSlots.indexOf(null);
  if(emptyIndex>=0)frontSlots[emptyIndex]=s.id;
  else frontSlots.push(s.id);
}

function flipOne(kind){
  if(getBacks().length===0)addPack();

  const s=getBacks()[0];
  if(!s)return;

  /* 뒤집은 막대가 차지하던 뒷면 자리를 빈칸으로 만든다.
     다음 팩은 이 자리를 우선적으로 재사용한다. */
  const backIndex=backSlots.indexOf(s.id);
  if(backIndex>=0)backSlots[backIndex]=null;

  s.state="front";
  s.order=++totalFlipped;
  s.kind=kind;
  fronts.push(s);
  putInFrontSlot(s);
  lastFlippedId=s.id;

  if(kind==="initial")initialRemaining--;
  if(kind==="bonus")pending=Math.max(0,pending-1);

  ensureBonusBacks();

  sound("flip");
}

function startGame(){
  initAudio();
  updateTitle();
  deck=[];fronts=[];discarded=[];selectedPair=[];frontSlots=[];backSlots=[];
  totalFlipped=0;pending=0;
  initialRemaining=Number($("initialCount").value);
  lastFlippedId=null;recentMovedIds.clear();
  ended=false;phase="initial";notice="";
  addPack();
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("finished").classList.add("hidden");

  if($("initialMode").value==="auto"){
    while(initialRemaining>0)flipOne("initial");
    phase="play";
    notice="럭컬이나 같은 색 짝을 눌러 처리해 줘!";
  }else{
    notice=`처음 막대를 ${initialRemaining}개 직접 눌러 뒤집어 줘!`;
  }
  render();
}

function tapBack(id){
  if(ended)return;
  initAudio();

  let s=deck.find(x=>x.id===id&&x.state==="back");

  if(!s && phase==="play" && pending>0){
    ensureBonusBacks();
    render();
    s=deck.find(x=>x.id===id&&x.state==="back");
    if(!s)return;
  }

  if(!s)return;

  if(phase==="initial"){
    flipOne("initial");
    if(initialRemaining<=0){
      phase="play";
      notice="럭컬이나 같은 색 짝을 눌러 처리해 줘!";
    }else{
      notice=`처음 막대를 더 뒤집어 줘! (${initialRemaining}개 남음)`;
    }
    render();
    return;
  }

  if(phase==="play"&&pending>0){
    flipOne("bonus");
    notice=pending>0
      ?`보너스 막대 ${pending}개 남음. 더 뒤집거나 보이는 효과를 처리해 줘!`
      :"보너스를 모두 뒤집었어! 새로 나온 럭컬과 짝컬을 확인해 줘.";
    render();
    checkEnd();
    return;
  }

  notice="먼저 보이는 럭컬이나 같은 색 짝을 처리해 줘!";
  render();
}

function moveToDiscard(sticks,type){
  const moving=sticks.filter(s=>fronts.some(f=>f.id===s.id));
  if(!moving.length)return;

  moving.forEach(s=>{
    s.state=type;
    recentMovedIds.add(s.id);
    discarded.push(s);
    const slotIndex=frontSlots.indexOf(s.id);
    if(slotIndex>=0)frontSlots[slotIndex]=null;
  });

  const ids=new Set(moving.map(s=>s.id));
  fronts=fronts.filter(s=>!ids.has(s.id));
  selectedPair=selectedPair.filter(id=>!ids.has(id));
}

function tapFront(id){
  if(ended||phase!=="play")return;
  initAudio();

  const s=fronts.find(x=>x.id===id&&x.state==="front");
  if(!s)return;

  if(s.color===luckyColor){
    selectedPair=[];
    moveToDiscard([s],"luckySelected");
    pending+=2;
    ensureBonusBacks();
    notice=`럭컬 처리! 보너스 ${pending}개가 준비됐어. 다른 효과를 처리하거나 보너스를 뒤집어 줘.`;
    sound("lucky");
    render();
    checkEnd();
    return;
  }

  if(selectedPair.includes(id)){
    selectedPair=[];
    notice="짝 선택을 취소했어.";
    render();
    return;
  }

  if(selectedPair.length===0){
    selectedPair=[id];
    notice="같은 색 막대 하나를 더 눌러 짝을 만들어 줘.";
    render();
    return;
  }

  const first=fronts.find(x=>x.id===selectedPair[0]);
  if(!first||first.color!==s.color){
    selectedPair=[id];
    notice="같은 색 막대 하나를 더 눌러 줘.";
    render();
    return;
  }

  selectedPair=[];
  moveToDiscard([first,s],"paired");
  pending++;
  ensureBonusBacks();
  notice=`짝컬 처리! 보너스 ${pending}개가 준비됐어. 다른 효과도 처리하거나 보너스를 뒤집어 줘.`;
  sound("pair");
  render();
  checkEnd();
}

function cancelPair(){
  if(!selectedPair.length)return;
  selectedPair=[];
  notice="짝 선택을 취소했어.";
  render();
}

function hasManualEffects(){
  if(fronts.some(s=>s.color===luckyColor&&s.state==="front"))return true;

  const counts={};
  fronts.forEach(s=>{
    if(s.state==="front"&&s.color!==luckyColor){
      counts[s.color]=(counts[s.color]||0)+1;
    }
  });

  return Object.values(counts).some(n=>n>=2);
}

function checkEnd(){
  if(ended||phase!=="play")return;
  if(pending>0)return;
  if(hasManualEffects())return;
  if(selectedPair.length>0)return;
  endGame();
}

function endGame(){
  if(ended)return;
  if(fronts.length)moveToDiscard([...fronts],"final");

  ended=true;phase="ended";selectedPair=[];
  notice="모든 효과를 처리했어!";
  $("finished").classList.remove("hidden");
  $("finalScore").textContent=`총 뒤집은 막대: ${totalFlipped}개`;
  sound("end");
  render();
}

function makeStick(s,isBack,area){
  const b=document.createElement("button");
  b.className="stick "+(isBack?"back":"front");

  if(selectedPair.includes(s.id))b.classList.add("selected");

  if(isBack){
    b.innerHTML='<span class="pattern"></span>';
    b.setAttribute("aria-label","뒤집힌 막대");
    b.onclick=()=>tapBack(s.id);
    return b;
  }

  const color=COLORS.find(c=>c.name===s.color);
  b.style.background=color?color.value:"#888";
  b.innerHTML='<span class="pattern"></span>';
  b.setAttribute("aria-label",s.color+" 막대");

  if(area==="front"&&s.state==="front")b.onclick=()=>tapFront(s.id);
  else b.disabled=true;

  if(s.id===lastFlippedId)b.classList.add("flip-in");
  if(recentMovedIds.has(s.id))b.classList.add("land-in");

  return b;
}

function makeEmptySlot(){
  const empty=document.createElement("div");
  empty.className="empty-slot";
  empty.setAttribute("aria-hidden","true");
  return empty;
}

function render(){
  $("backs").innerHTML="";

  /* backSlots 순서대로 그려 빈자리를 새 팩이 재사용한다. */
  backSlots.forEach(id=>{
    if(id===null){
      $("backs").appendChild(makeEmptySlot());
      return;
    }

    const s=deck.find(x=>x.id===id&&x.state==="back");
    $("backs").appendChild(s?makeStick(s,true,"back"):makeEmptySlot());
  });

  $("fronts").innerHTML="";
  frontSlots.forEach(id=>{
    if(id===null){
      $("fronts").appendChild(makeEmptySlot());
      return;
    }

    const s=fronts.find(x=>x.id===id&&x.state==="front");
    $("fronts").appendChild(s?makeStick(s,false,"front"):makeEmptySlot());
  });

  $("discarded").innerHTML="";
  discarded.forEach(s=>{
    $("discarded").appendChild(makeStick(s,false,"discarded"));
  });

  $("status").textContent=notice;
  $("stats").textContent=`럭컬 색: ${luckyColor} · 뒤집은 개수: ${totalFlipped} · 보너스 남음: ${pending}`;
  $("cancelPair").disabled=selectedPair.length===0;
  $("soundToggle").textContent=soundOn?"🔊 소리 켜짐":"🔇 소리 꺼짐";

  requestAnimationFrame(()=>{
    lastFlippedId=null;
    recentMovedIds.clear();
  });
}

$("startBtn").onclick=startGame;
$("cancelPair").onclick=cancelPair;

$("soundToggle").onclick=async()=>{
  soundOn=!soundOn;

  if(soundOn){
    const ctx=initAudio();
    if(ctx){
      try{
        if(ctx.state!=="running")await ctx.resume();
        sound("flip");
      }catch(e){}
    }
  }

  render();
};

$("restart").onclick=()=>{
  phase="setup";
  ended=false;
  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
  makeColorChoices();
  updateTitle();
};

makeColorChoices();
updateTitle();
</script>
</body>
</html>
