
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컬러 막대 게임</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1e8;color:#302b35;font-family:system-ui,sans-serif;padding:14px}
h1{text-align:center;font-size:26px;margin:8px 0}
h2{font-size:18px;margin:0 0 10px}
p{line-height:1.5}
.panel{background:white;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 8px #0000000c}
button,select,input{font:inherit}
button{border:0;border-radius:12px;padding:11px 14px;background:#51417f;color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.35}
.secondary{background:#e9e4f3;color:#40355e}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings label{display:block;font-size:14px}
select{width:100%;padding:8px;border-radius:9px;border:1px solid #ccc;margin-top:5px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colorChoice{width:36px;height:36px;border:3px solid white;outline:1px solid #bbb;border-radius:9px;padding:0}
.colorChoice.chosen{outline:3px solid #51417f}
.status{font-weight:700;line-height:1.5}
.counter{font-size:14px;color:#655e6d}
.sticks{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:start}
.stick{min-width:0;width:100%;height:68px;border-radius:6px;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 #ffffff66,0 3px 2px #0002;position:relative}
.stick.back{background:repeating-linear-gradient(45deg,#51417f,#51417f 5px,#655393 5px,#655393 10px);border:1px solid #a99acb;color:#fff}
.stick.front{border:1px solid #ffffff99;color:white;text-shadow:0 1px 2px #0005}
.stick.selected{outline:3px solid #e0a62c;outline-offset:1px}
.stick.lucky{box-shadow:inset 0 0 0 3px #ffe16a,0 3px 2px #0002}
.stick.paired{opacity:.58;filter:saturate(.6)}
.stick .num{position:absolute;bottom:3px;right:3px;font-size:9px;background:#0003;border-radius:4px;padding:1px 2px}
.stick .mark{font-size:12px;position:absolute;top:2px;left:2px}
.stick .symbol{font-size:16px}
.small{font-size:12px;color:#716a78}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hidden{display:none!important}
#message{white-space:pre-line}
@media(max-width:420px){body{padding:9px}.panel{padding:10px}.sticks{gap:3px}.stick{height:57px}.stick .symbol{font-size:13px}.settings{gap:8px}}
</style>
</head>
<body>
<h1>🌈 컬러 막대 게임</h1>
<p style="text-align:center;margin-top:0">막대를 뒤집고, 럭컬과 짝컬을 처리하자!</p>

<section class="panel" id="setup">
<h2>게임 설정</h2>
<p class="small">럭컬 색깔을 하나 골라 줘.</p>
<div class="colors" id="colorChoices"></div>
<div class="settings" style="margin-top:14px">
<label>처음 뒤집을 개수
<select id="initialCount">
<option>5</option><option>6</option><option>7</option>
<option>8</option><option>9</option><option>10</option><option>11</option>
</select></label>
<label>처음 뒤집기
<select id="initialMode"><option value="manual">직접 누르기</option><option value="auto">자동 뒤집기</option></select></label>
<label>보너스 뒤집기
<select id="bonusMode"><option value="auto">자동 뒤집기</option><option value="manual">직접 누르기</option></select></label>
<label>럭컬 처리
<select id="luckyMode"><option value="manual">직접 누르기</option><option value="auto">자동 처리</option></select></label>
<label>짝컬 처리
<select id="pairMode"><option value="manual">직접 누르기</option><option value="auto">자동 처리</option></select></label>
</div>
<div class="actionrow"><button id="startBtn">게임 시작!</button></div>
</section>

<section id="game" class="hidden">
<div class="panel">
<div class="status" id="status">막대를 뒤집어 줘!</div>
<div class="counter" id="stats"></div>
<div class="actionrow">
<button class="secondary" id="cancelPair">짝 선택 취소</button>
</div>
</div>

<div class="panel">
<h2>① 뒷면 막대</h2>
<p class="small">원하는 막대를 눌러 뒤집어 줘.</p>
<div class="sticks" id="backs"></div>
</div>

<div class="panel">
<h2>② 앞면 막대</h2>
<p class="small">뒤집은 순서대로 쌓여. 럭컬은 한 개, 짝컬은 같은 색 두 개를 눌러 줘.</p>
<div class="sticks" id="fronts"></div>
</div>

<div class="panel">
<h2>③ 내려놓은 막대</h2>
<p class="small">럭컬과 짝컬이 이곳에 모여.</p>
<div class="sticks" id="discarded"></div>
</div>

<div class="panel hidden" id="finished">
<h2>🎉 게임 종료!</h2>
<p id="finalScore" class="status"></p>
<button id="restart">다시 하기</button>
</div>
</section>

<script>
const COLORS=[
 {name:"빨강",value:"#e34e4e"},
 {name:"노랑",value:"#e2b62e"},
 {name:"분홍",value:"#e779ad"},
 {name:"보라",value:"#865bd1"},
 {name:"검정",value:"#393740"},
 {name:"파랑",value:"#4389d8"},
 {name:"회색",value:"#858b95"}
];
const $=id=>document.getElementById(id);
let luckyColor=COLORS[0].name;
let deck=[],fronts=[],discarded=[],selectedPair=[];
let totalFlipped=0,pending=0,initialRemaining=0,bonusRemaining=0;
let phase="setup",processing=false,ended=false;
let luckyQueue=[],pairQueue=[],notice="";

function makeColorChoices(){
 $("colorChoices").innerHTML="";
 COLORS.forEach(c=>{
  const b=document.createElement("button");
  b.className="colorChoice"+(c.name===luckyColor?" chosen":"");
  b.style.background=c.value;
  b.title=c.name;
  b.setAttribute("aria-label",c.name);
  b.onclick=()=>{
   if(phase!=="setup")return;
   luckyColor=c.name;makeColorChoices();
  };
  $("colorChoices").appendChild(b);
 });
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function addPack(){
 const pack=[];
 COLORS.forEach(c=>{for(let i=0;i<7;i++)pack.push(c.name)});
 pack.push(COLORS[Math.floor(Math.random()*COLORS.length)].name);
 shuffle(pack);
 pack.forEach(color=>deck.push({id:Math.random().toString(36).slice(2),color,state:"back",order:0}));
}
function startGame(){
 deck=[];fronts=[];discarded=[];selectedPair=[];
 totalFlipped=0;pending=0;initialRemaining=Number($("initialCount").value);
 bonusRemaining=0;phase="initial";processing=false;ended=false;
 luckyQueue=[];pairQueue=[];notice="";
 addPack();
 $("setup").classList.add("hidden");
 $("game").classList.remove("hidden");
 $("finished").classList.add("hidden");
 if($("initialMode").value==="auto"){
  while(initialRemaining>0)flipOne("initial");
  phase="play";
  processEffects();
 }else{
  notice="처음 막대를 직접 눌러 뒤집어 줘!";
 }
 render();
}
function flipOne(kind){
 if(deck.filter(s=>s.state==="back").length===0)addPack();
 const s=deck.find(x=>x.state==="back");
 if(!s)return;
 s.state="front";s.order=++totalFlipped;s.kind=kind;
 fronts.push(s);
 if(kind==="initial")initialRemaining--;
 if(kind==="bonus"){bonusRemaining--;pending=Math.max(0,pending-1)}
}
function tapBack(id){
 if(ended||processing)return;
 const s=deck.find(x=>x.id===id);
 if(!s||s.state!=="back")return;
 if(phase==="initial"){
  flipOne("initial");
  if(initialRemaining<=0){phase="play";notice="초기 막대 뒤집기 완료! 럭컬을 처리하거나 짝컬 두 개를 선택해 줘."}
 }else if(phase==="bonus"){
  flipOne("bonus");
  if(bonusRemaining<=0){phase="play";notice="보너스 막대를 모두 뒤집었어. 이제 효과를 처리해 줘."}
 }else return;
 render();
 if(phase==="play")processEffects();
}
function tapFront(id){
 if(ended||processing||phase!=="play")return;
 const s=fronts.find(x=>x.id===id);
 if(!s||s.state!=="front")return;
 if(s.color===luckyColor){
  s.state="luckySelected";
  discarded.push(s);fronts=fronts.filter(x=>x.id!==id);
  pending+=2;
  notice="럭컬 처리 완료! 보너스 막대 2개를 뒤집어야 해.";
  render();
  processEffects();
  return;
 }
 if(selectedPair.includes(id)){
  selectedPair=selectedPair.filter(x=>x!==id);render();return;
 }
 const same=selectedPair.length?fronts.find(x=>x.id===selectedPair[0]):null;
 if(same&&same.color!==s.color){selectedPair=[id];notice="같은 색 막대 두 개를 선택해 줘.";render();return}
 selectedPair.push(id);
 if(selectedPair.length===2){
  const a=fronts.find(x=>x.id===selectedPair[0]);
  const b=fronts.find(x=>x.id===selectedPair[1]);
  if(a&&b&&a.color===b.color&&a.color!==luckyColor){
   a.state="paired";b.state="paired";
   fronts=fronts.filter(x=>x.id!==a.id&&x.id!==b.id);
   discarded.push(a,b);pending+=1;
   selectedPair=[];notice="짝컬 처리 완료! 보너스 막대 1개를 뒤집어야 해.";
   render();processEffects();return;
  }
  selectedPair=[id];notice="같은 색 막대 두 개를 선택해 줘.";
 }
 render();
}
function processEffects(){
 if(ended||processing)return;
 if(phase==="initial"||phase==="bonus"){render();return}
 processing=true;
 // Automatic lucky collection is performed only when no bonus reveals are pending.
 if(pending===0&&$("luckyMode").value==="auto"){
  const luckies=fronts.filter(s=>s.color===luckyColor&&s.state==="front");
  luckies.forEach(s=>{s.state="luckySelected";fronts=fronts.filter(x=>x.id!==s.id);discarded.push(s);pending+=2});
 }
 // Process pairs automatically if enabled.
 if($("pairMode").value==="auto"){
  let changed=true;
  while(changed){
   changed=false;
   for(const c of COLORS.map(x=>x.name).filter(x=>x!==luckyColor)){
    const same=fronts.filter(s=>s.color===c&&s.state==="front");
    if(same.length>=2){
     const a=same[0],b=same[1];
     a.state="paired";b.state="paired";
     fronts=fronts.filter(s=>s.id!==a.id&&s.id!==b.id);
     discarded.push(a,b);pending++;changed=true;break;
    }
   }
  }
 }
 processing=false;
 if(pending>0){
  if($("bonusMode").value==="auto"){
   phase="bonus";bonusRemaining=pending;
   while(bonusRemaining>0)flipOne("bonus");
   phase="play";
   notice=" 보너스 막대를 모두 뒤집었어!";
   render();
   processEffects();
   return;
  }else{
   phase="bonus";bonusRemaining=pending;
   notice="보너스 막대를 직접 눌러 모두 뒤집어 줘!";
   render();return;
  }
 }
 // If manual effects remain, wait for the user to resolve them.
 const hasLucky=fronts.some(s=>s.color===luckyColor&&s.state==="front");
 const hasPair=COLORS.some(c=>c.name!==luckyColor&&fronts.filter(s=>s.color===c.name&&s.state==="front").length>=2);
 if(hasLucky||hasPair){
  notice=(hasLucky?"럭컬이 있어! 럭컬 막대를 눌러 줘. ":"")+(hasPair?"짝컬이 있어! 같은 색 두 개를 눌러 줘.":"");
  render();return;
 }
 if(phase==="bonus"&&bonusRemaining>0){render();return}
 phase="play";
 notice="더 이상 처리할 효과가 없어. 게임을 종료할게!";
 render();
 endGame();
}
function endGame(){
 if(ended)return;
 ended=true;phase="ended";
 $("finished").classList.remove("hidden");
 $("finalScore").textContent=`총 뒤집은 막대: ${totalFlipped}개`;
 render();
}
function makeStick(s,back,area){
 const b=document.createElement("button");
 b.className="stick "+(back?"back":"front");
 if(s.id===selectedPair[0]||s.id===selectedPair[1])b.classList.add("selected");
 if(s.color===luckyColor&&!back)b.classList.add("lucky");
 if(s.state==="paired")b.classList.add("paired");
 if(back){
  b.innerHTML='<span class="symbol">✦</span>';
  b.onclick=()=>tapBack(s.id);
 }else{
  b.style.background=COLORS.find(c=>c.name===s.color).value;
  let mark="";
  if(s.state==="luckySelected")mark="★";
  if(s.state==="paired")mark="✓";
  b.innerHTML=`<span class="mark">${mark}</span><span class="symbol">${s.color}</span><span class="num">${s.order}</span>`;
  if(area==="front"&&s.state==="front")b.onclick=()=>tapFront(s.id);
  else b.disabled=true;
 }
 return b;
}
function render(){
 $("backs").innerHTML="";
 deck.filter(s=>s.state==="back").forEach(s=>$("backs").appendChild(makeStick(s,true,"back")));
 $("fronts").innerHTML="";
 fronts.forEach(s=>$("fronts").appendChild(makeStick(s,false,"front")));
 $("discarded").innerHTML="";
 discarded.forEach(s=>$("discarded").appendChild(makeStick(s,false,"discarded")));
 $("status").textContent=notice||(phase==="initial"?"초기 막대를 뒤집어 줘!":phase==="bonus"?"보너스 막대를 뒤집어 줘!":"럭컬과 짝컬을 처리해 줘!");
 $("stats").textContent=`럭컬 색: ${luckyColor} · 뒤집은 개수: ${totalFlipped} · 남은 보너스: ${pending}`;
 $("cancelPair").disabled=selectedPair.length===0;
}
$("startBtn").onclick=startGame;
$("cancelPair").onclick=()=>{selectedPair=[];notice="짝 선택을 취소했어.";render()};
$("restart").onclick=()=>{phase="setup";$("game").classList.add("hidden");$("setup").classList.remove("hidden");makeColorChoices()};
makeColorChoices();
</script>
</body>
</html>
